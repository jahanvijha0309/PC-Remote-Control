name: Build APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build debug APK
        working-directory: android-app
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: cp android-app/app/build/outputs/apk/debug/app-debug.apk "PC-Remote-${{ github.ref_name }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-apk
          path: PC-Remote-*.apk

      # Pushing a tag like v1.2.0 attaches the APK to a GitHub Release automatically.
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: PC-Remote-*.apk
          generate_release_notes: true
