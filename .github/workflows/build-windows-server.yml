name: Build Windows installer

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build the server .exe
        working-directory: pc-server
        run: |
          pip install -r requirements.txt pyinstaller
          pyinstaller --noconfirm --clean --onedir --windowed --name PC-Remote-Server --collect-submodules comtypes --collect-all pycaw --hidden-import pygetwindow main.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build the installer
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          $version = if ($ref -match '^v(\d+\.\d+\.\d+)') { $Matches[1] } else { "0.0.0-dev" }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" installer\PC-Remote-Server.iss

      - uses: actions/upload-artifact@v4
        with:
          name: PC-Remote-Server-Setup
          path: installer/Output/*.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: true
